# Dev/test Postgres only. The app itself runs via `make run` or the Docker image.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      # Override with TEST_DB_PORT if 5433 is taken (the Makefile passes it through).
      - "${TEST_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
