[package]
name = "invoice"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "invoice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false }
mdcast-client = "0.4.2"
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
rust_decimal = { version = "1", features = ["serde"] }
rust-embed = "8"
sea-orm = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-rust_decimal", "with-json", "postgres-array"] }
sea-orm-migration = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["uuid", "chrono", "decimal"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono-tz = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
