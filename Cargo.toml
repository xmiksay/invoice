[package]
name = "invoice"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "invoice"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false }
mime_guess = "2"
rust-embed = "8"
sea-orm = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
